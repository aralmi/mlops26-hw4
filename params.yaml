# Единственное место, где живёт конфигурация препроцессинга.
# Правится ЗДЕСЬ, а не в коде: в src/ не должно быть ни имени модели,
# ни длин, ни порогов.
model:
  name: "Qwen/Qwen3-0.6B"
  # Пустой think-блок шаблона входит в промпт и исключается из лосса.
  enable_thinking: false

data:
  # Неиспользуемые пути make sample оставлены только для преподавательского среза.
  source_train: "../../datasets/nmo/sft_single/train/0000.parquet"
  source_val: "../../datasets/nmo/sft_single/validation/0000.parquet"
  train_jsonl: "data/train.jsonl"
  val_jsonl: "data/val.jsonl"
  out_dir: "data/tokenized"

sample:
  train_size: 500
  val_size: 100
  scan_rows: 20000          # сколько строк parquet просматриваем перед выборкой
  seed: 42

tokenize:
  # p99 train=3376, val=2801; округление верхнего p99 вверх до кратного 128.
  max_seq_len: 3456
  truncated_warn_ratio: 0.05
  padding_side: "left"

packing:
  # Нет блочно-диагональной attention mask — нет packing.
  enabled: false
  batch_size: 8             # для пересчёта выигрыша в шагах оптимизатора

train_estimate:
  epochs: 3
  # Медиана реального замера ДЗ 1 (Apple Silicon, ГЕНЕРАЦИЯ).
  # Обучение медленнее: forward + backward + optimizer. Реальное число
  # подставляется сюда после первого прогона ДЗ 5.
  tokens_per_sec: 34.93
  source: "docs/hw1_bench.json"
